<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Windows XP — Discord Activity</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }
      #gameParent {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover;
        image-rendering: auto;
      }
      #guide {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Pre-JS loading screen — visible until Phaser takes over */
      #html-loader {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Courier New', monospace;
        color: #fff;
        gap: 18px;
      }
      #html-loader.hidden { display: none; }
      .hl-title {
        font-size: clamp(13px, 3vw, 18px);
        letter-spacing: 0.25em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .hl-dots {
        display: flex;
        gap: 8px;
      }
      .hl-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.2;
        animation: hl-pulse 1.2s ease-in-out infinite;
      }
      .hl-dot:nth-child(1) { animation-delay: 0s; }
      .hl-dot:nth-child(2) { animation-delay: 0.2s; }
      .hl-dot:nth-child(3) { animation-delay: 0.4s; }
      .hl-dot:nth-child(4) { animation-delay: 0.6s; }
      @keyframes hl-pulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(1); }
        40% { opacity: 1; transform: scale(1.3); }
      }
      .hl-sub {
        font-size: clamp(10px, 2vw, 13px);
        opacity: 0.4;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <!-- Shown immediately, before any JS loads -->
    <div id="html-loader">
      <div class="hl-title">The Waiting Screen</div>
      <div class="hl-dots">
        <div class="hl-dot"></div>
        <div class="hl-dot"></div>
        <div class="hl-dot"></div>
        <div class="hl-dot"></div>
      </div>
      <div class="hl-sub">Loading…</div>
    </div>

    <div id="gameParent">
      <div id="guide"></div>
    </div>
    <script type="module" src="src/main.ts"></script>
    <script>
      // Hide the HTML loader as soon as Phaser's canvas appears
      const obs = new MutationObserver(() => {
        if (document.querySelector('#gameParent canvas')) {
          const el = document.getElementById('html-loader');
          if (el) el.classList.add('hidden');
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('gameParent'), { childList: true });
    </script>
  </body>
</html>
