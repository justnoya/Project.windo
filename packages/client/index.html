<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Windows XP — Discord Activity</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }
      #gameParent {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover;
        image-rendering: auto;
      }
      #guide {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="gameParent">
      <div id="guide"></div>
    </div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
